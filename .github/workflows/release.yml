name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            optional: false
            bundle: dmg
            artifact_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            optional: false
            bundle: nsis
            artifact_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            optional: false
            bundle: appimage
            artifact_glob: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage*

    env:
      VITE_API_URL: ${{ vars.MOBILE_API_URL }}
      VITE_DESKTOP_BUILD: "true"
      # linuxdeploy/AppRun can't use FUSE on GitHub runners; extract-and-run avoids it.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf || \
          sudo apt-get install -y libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Install desktop tooling
        run: npm ci

      - name: Import Windows Authenticode certificate
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "::warning::Windows signing secrets not set - building an UNSIGNED Windows installer (users will see a SmartScreen 'unknown publisher' warning). Set WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD to enable signing."
            "WINDOWS_SIGNING=0" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "safenode-windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false
          if (-not $certificate.Thumbprint) { throw "Windows signing certificate import failed" }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

          $configPath = "src-tauri/tauri.windows.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $certificate.Thumbprint -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath
          "WINDOWS_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build desktop app
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'windows' && env.WINDOWS_SIGNING == '1'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.StatusMessage)" }
          if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT) {
            throw "Windows installer was signed by an unexpected certificate"
          }

      - name: Sign and checksum Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LINUX_GPG_PRIVATE_KEY_BASE64}" || { echo "LINUX_GPG_PRIVATE_KEY_BASE64 is required" >&2; exit 1; }
          KEY_FILE="${RUNNER_TEMP}/safenode-linux-signing.asc"
          printf '%s' "${LINUX_GPG_PRIVATE_KEY_BASE64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          gpg --batch --import "${KEY_FILE}"
          KEY_FINGERPRINT="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "${KEY_FINGERPRINT}" || { echo "No Linux signing key was imported" >&2; exit 1; }
          APPIMAGE="$(find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "${APPIMAGE}"
          sha256sum "${APPIMAGE}" > "${APPIMAGE}.sha256"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${LINUX_GPG_PASSPHRASE}" \
            --local-user "${KEY_FINGERPRINT}" --armor --detach-sign "${APPIMAGE}"
          sha256sum --check "${APPIMAGE}.sha256"
          gpg --batch --verify "${APPIMAGE}.asc" "${APPIMAGE}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: ${{ matrix.optional && 'warn' || 'error' }}

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/safenode-linux-signing.asc" "${RUNNER_TEMP}/safenode-windows-signing.pfx"

  build-android-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    # Non-blocking: a signing/domain misconfiguration here must not stop the
    # desktop + extension release from publishing. Android downloads are gated
    # behind VITE_ANDROID_DOWNLOAD_ENABLED and stay off until this is green.
    continue-on-error: true
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ github.ref_name }}
      EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Install native mobile dependencies
        run: npm ci --prefix mobile

      - name: Validate mobile API origin
        run: |
          test -n "${EXPO_PUBLIC_API_URL}"
          case "${EXPO_PUBLIC_API_URL}" in
            https://*) ;;
            *) echo "MOBILE_API_URL must be an HTTPS origin" >&2; exit 1 ;;
          esac
          test "${EXPO_PUBLIC_API_URL}" = "${EXPO_PUBLIC_API_URL%/}"

      - name: Generate native Android project
        working-directory: ./mobile
        run: |
          npx expo prebuild --platform android --no-install
          node scripts/configure-android-release.mjs

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "${ANDROID_KEYSTORE_BASE64}"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${ANDROID_KEYSTORE_PATH}"
          chmod 600 "${ANDROID_KEYSTORE_PATH}"

      - name: Build signed native Android APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify Android signature and domain association
        run: |
          set -uo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK}" ]; then
            echo "::error::Signed APK not found at ${APK}. Listing build outputs:"
            ls -R mobile/android/app/build/outputs/apk 2>/dev/null || true
            exit 1
          fi
          if [ -z "${ANDROID_CERT_SHA256}" ]; then
            echo "::error::Repository variable ANDROID_CERT_SHA256 is not set. Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner"
          ACTUAL_FINGERPRINT="$(${APKSIGNER} verify --print-certs "${APK}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_FINGERPRINT="$(printf '%s' "${ANDROID_CERT_SHA256}" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          echo "Expected fingerprint: ${EXPECTED_FINGERPRINT}"
          echo "Actual   fingerprint: ${ACTUAL_FINGERPRINT}"
          if [ "${ACTUAL_FINGERPRINT}" != "${EXPECTED_FINGERPRINT}" ]; then
            echo "::error::APK signing certificate does not match ANDROID_CERT_SHA256. Update the variable to match the keystore, or re-sign with the expected key."
            exit 1
          fi
          if ! grep -Fq "${ANDROID_CERT_SHA256}" frontend/public/.well-known/assetlinks.json; then
            echo "::error::ANDROID_CERT_SHA256 fingerprint is missing from frontend/public/.well-known/assetlinks.json (breaks passkey domain association)."
            exit 1
          fi
          echo "Android signature and domain association verified."

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove restored signing material
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH}"

  package-extensions:
    name: Package Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zips
        run: |
          mkdir -p release-assets
          cp -R extension release-assets/chrome
          cp -R extension release-assets/firefox
          cp -R extension release-assets/safari

          python - <<'PY'
          import json
          from pathlib import Path

          firefox_manifest = Path("release-assets/firefox/manifest.json")
          fm = json.loads(firefox_manifest.read_text())
          fm["browser_specific_settings"] = {"gecko": {"id": "safenode@safe-node.app", "strict_min_version": "109.0"}}
          fm["background"] = {"scripts": ["background.js"]}
          fm.pop("web_accessible_resources", None)
          firefox_manifest.write_text(json.dumps(fm, indent=2) + "\n")

          safari_manifest = Path("release-assets/safari/manifest.json")
          sm = json.loads(safari_manifest.read_text())
          sm["name"] = "Safenode Password Manager (Safari)"
          sm.pop("web_accessible_resources", None)
          safari_manifest.write_text(json.dumps(sm, indent=2) + "\n")
          PY

          cd release-assets/chrome && zip -rq ../safenode-extension-chrome.zip . && cd ../..
          cd release-assets/firefox && zip -rq ../safenode-extension-firefox.zip . && cd ../..
          cd release-assets/safari && zip -rq ../safenode-extension-safari.zip . && cd ../..
          rm -rf release-assets/chrome release-assets/firefox release-assets/safari

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            release-assets/safenode-extension-chrome.zip
            release-assets/safenode-extension-firefox.zip
            release-assets/safenode-extension-safari.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-desktop
      - build-android-apk
      - package-extensions
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Normalize filenames
        run: |
          mkdir -p release-assets

          MAC_FILE="$(find artifacts/desktop-macos -type f -name '*.dmg' | head -n 1 || true)"
          WIN_FILE="$(find artifacts/desktop-windows -type f -name '*.exe' | head -n 1 || true)"
          LINUX_FILE="$(find artifacts/desktop-linux -type f -name '*.AppImage' | head -n 1 || true)"
          LINUX_SIGNATURE="$(find artifacts/desktop-linux -type f -name '*.AppImage.asc' | head -n 1 || true)"
          ANDROID_FILE="$(find artifacts/android-apk -type f -name '*.apk' | head -n 1 || true)"

          if [ -z "${MAC_FILE}" ]; then
            echo "Missing macOS artifact"
            exit 1
          fi
          if [ -z "${WIN_FILE}" ]; then
            echo "Missing Windows artifact"
            exit 1
          fi
          if [ -z "${LINUX_FILE}" ]; then
            echo "Missing Linux artifact"
            exit 1
          fi

          cp "${MAC_FILE}" release-assets/Safenode-macOS.dmg
          cp "${WIN_FILE}" release-assets/Safenode-Windows.exe
          if [ -z "${ANDROID_FILE}" ]; then
            echo "::warning::Android APK missing (build-android-apk did not succeed) - publishing desktop + extensions without the Android download."
          else
            cp "${ANDROID_FILE}" release-assets/Safenode-Android.apk
          fi
          cp "${LINUX_FILE}" release-assets/Safenode-Linux.AppImage
          if [ -z "${LINUX_SIGNATURE}" ]; then
            echo "Missing Linux GPG signature"
            exit 1
          fi
          cp "${LINUX_SIGNATURE}" release-assets/Safenode-Linux.AppImage.asc
          sha256sum release-assets/Safenode-Linux.AppImage > release-assets/Safenode-Linux.AppImage.sha256

          cp artifacts/extensions/safenode-extension-chrome.zip release-assets/safenode-extension-chrome.zip
          cp artifacts/extensions/safenode-extension-firefox.zip release-assets/safenode-extension-firefox.zip
          cp artifacts/extensions/safenode-extension-safari.zip release-assets/safenode-extension-safari.zip

          (cd release-assets && sha256sum Safenode-* safenode-extension-*.zip | grep -v -E '\.(asc|sha256)$' > SHA256SUMS)

      - name: GPG-sign SHA256SUMS
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${LINUX_GPG_PRIVATE_KEY_BASE64}" || { echo "GPG key required to sign SHA256SUMS" >&2; exit 1; }
          KEY_FILE="${RUNNER_TEMP}/safenode-sums-signing.asc"
          printf '%s' "${LINUX_GPG_PRIVATE_KEY_BASE64}" | base64 --decode > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          gpg --batch --import "${KEY_FILE}"
          FPR="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr"{print $10; exit}')"
          test -n "${FPR}"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${LINUX_GPG_PASSPHRASE}" \
            --local-user "${FPR}" --armor --detach-sign release-assets/SHA256SUMS
          gpg --batch --verify release-assets/SHA256SUMS.asc release-assets/SHA256SUMS
          rm -f "${KEY_FILE}"

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/safenode-sums-signing.asc"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
