name: CI/CD Pipeline

# type-check is blocking; unit tests actually run and can fail the build.
# lint stays non-blocking until the lint baseline is clean (flip `|| true` off then).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safenode_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safenode_test
      NODE_ENV: test
      JWT_SECRET: test-only-ci-secret-not-used-in-prod-000000000000
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcy1wYWQwMDA=

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run database migrations
        working-directory: ./backend
        run: npx prisma migrate deploy

      - name: Type check (blocking)
        working-directory: ./backend
        run: npm run type-check

      - name: Lint (non-blocking for now)
        working-directory: ./backend
        run: npm run lint || true

      - name: Run backend tests (blocking)
        working-directory: ./backend
        run: npm test

      - name: Build backend
        working-directory: ./backend
        run: npm run build

  # --------------------------------------------------------------- Frontend
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version matches latest tag
        run: |
          set -euo pipefail

          LATEST_TAG="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | head -n 1 || true)"
          if [ -z "${LATEST_TAG}" ]; then
            echo "No git tags found; skipping release version sync check."
            exit 0
          fi

          if [ ! -f "frontend/src/config/release.ts" ]; then
            echo "Missing frontend/src/config/release.ts"
            exit 1
          fi

          FILE_VERSION="$(awk -F\"'\" '/RELEASE_VERSION/ {print $2; exit}' frontend/src/config/release.ts)"
          if [ -z "${FILE_VERSION}" ]; then
            echo "Could not read RELEASE_VERSION from frontend/src/config/release.ts"
            exit 1
          fi

          normalize() {
            local v="$1"
            if [[ "${v}" == v* ]]; then
              echo "${v}"
            else
              echo "v${v}"
            fi
          }

          EXPECTED="$(normalize "${LATEST_TAG}")"
          ACTUAL="$(normalize "${FILE_VERSION}")"

          echo "Latest tag: ${EXPECTED}"
          echo "Release file version: ${ACTUAL}"

          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "Version mismatch: latest git tag (${EXPECTED}) != frontend/src/config/release.ts (${ACTUAL})"
            echo "Update frontend/src/config/release.ts before merging."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check (blocking)
        working-directory: ./frontend
        run: npm run type-check

      - name: Lint (non-blocking for now)
        working-directory: ./frontend
        run: npm run lint || true

      - name: Run frontend tests (blocking)
        working-directory: ./frontend
        run: npx vitest run

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.safe-node.app

  # -------------------------------------------------------------------- E2E
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Enabled on demand / schedule until the e2e suite is stable.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [backend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safenode_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safenode_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install & migrate
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
      - name: Run e2e tests
        working-directory: ./backend
        run: npx jest tests/e2e --runInBand
