name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests & Build
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safenode_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safenode_test

      - name: Run database migrations
        working-directory: ./backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/safenode_test

      - name: Run backend type check
        working-directory: ./backend
        run: npm run type-check || true

      - name: Run backend lint
        working-directory: ./backend
        run: npm run lint || true

      - name: Build backend
        working-directory: ./backend
        run: npm run build

  # Frontend Tests & Build
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version matches latest tag
        run: |
          set -euo pipefail

          LATEST_TAG="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | head -n 1 || true)"
          if [ -z "${LATEST_TAG}" ]; then
            echo "No git tags found; skipping release version sync check."
            exit 0
          fi

          if [ ! -f "frontend/src/config/release.ts" ]; then
            echo "Missing frontend/src/config/release.ts"
            exit 1
          fi

          FILE_VERSION="$(awk -F\"'\" '/RELEASE_VERSION/ {print $2; exit}' frontend/src/config/release.ts)"
          if [ -z "${FILE_VERSION}" ]; then
            echo "Could not read RELEASE_VERSION from frontend/src/config/release.ts"
            exit 1
          fi

          normalize() {
            local v="$1"
            if [[ "${v}" == v* ]]; then
              echo "${v}"
            else
              echo "v${v}"
            fi
          }

          EXPECTED="$(normalize "${LATEST_TAG}")"
          ACTUAL="$(normalize "${FILE_VERSION}")"

          echo "Latest tag: ${EXPECTED}"
          echo "Release file version: ${ACTUAL}"

          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "Version mismatch: latest git tag (${EXPECTED}) != frontend/src/config/release.ts (${ACTUAL})"
            echo "Update frontend/src/config/release.ts before merging."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend type check
        working-directory: ./frontend
        run: npm run type-check || true

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint || true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.safe-node.app

  # E2E Tests (optional - can be added later)
