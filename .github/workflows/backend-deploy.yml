name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy SafeNode API
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
      RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
      RAILWAY_PUBLIC_DOMAIN: ${{ vars.RAILWAY_PUBLIC_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT"
          test -n "$RAILWAY_SERVICE_NAME"
          test -n "$RAILWAY_PUBLIC_DOMAIN"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy backend
        run: |
          railway up backend \
            --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_NAME" \
            --ci \
            --message "GitHub ${GITHUB_SHA}"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://${RAILWAY_PUBLIC_DOMAIN}/api/health"
          for attempt in $(seq 1 24); do
            code=$(curl --silent --show-error --location \
              --output /tmp/health.json \
              --write-out '%{http_code}' \
              --max-time 10 \
              "$health_url" || true)
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check attempt ${attempt}/24 returned ${code:-000}"
            sleep 10
          done
          echo "Production health check failed: $health_url"
          exit 1
